name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions fixadas por hash de commit (não por tag, que pode ser movida por um
# atacante). O Dependabot atualiza os hashes respeitando o cooldown.
jobs:
  verificar:
    name: Tipos, testes, build e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      # ignore-scripts vem do .npmrc: nenhum postinstall de terceiros roda no CI
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Regras do Firestore (emulador)
        run: npm run test:rules
      - name: Build (inclui checagem de licenças)
        run: npm run build
      - name: Vulnerabilidades no que vai para o jogador
        run: npm audit --omit=dev --audit-level=high

  ponta-a-ponta:
    name: Ponta a ponta (navegador + emuladores)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Usa o Google Chrome que já vem instalado no runner (nada é baixado).
      # Falhas viram anotações (::error::) visíveis na página da execução.
      - run: npm run test:e2e
        env:
          E2E_BROWSER: chrome
      - name: Capturas de tela
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-capturas
          path: test-results/e2e/
          retention-days: 7
